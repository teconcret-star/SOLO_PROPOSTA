<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js"></script>
    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC8IRsEWgUZEY6AwdOWE8ZCVPorPuObdFA",
            authDomain: "solomix-56b7b.firebaseapp.com",
            projectId: "solomix-56b7b",
            storageBucket: "solomix-56b7b.firebasestorage.app",
            messagingSenderId: "851808503220",
            appId: "1:851808503220:web:f1d632e4405331385d1ee1",
            measurementId: "G-8PVVFM0KRX"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Function to migrate localStorage data to Firestore
        function migrateToFirestore() {
            const clientData = localStorage.getItem('clientes');
            const proposalData = localStorage.getItem('propostas');
            const scheduleData = localStorage.getItem('programacoes');
            const profileData = localStorage.getItem('perfil_do_vendedor');

            if (clientData) db.collection('clientes').add(JSON.parse(clientData));
            if (proposalData) db.collection('propostas').add(JSON.parse(proposalData));
            if (scheduleData) db.collection('programacoes').add(JSON.parse(scheduleData));
            if (profileData) db.collection('perfil_do_vendedor').add(JSON.parse(profileData));
        }

        // Call the migration function
        window.onload = function() {
            migrateToFirestore();
        };
    </script>
</head>
